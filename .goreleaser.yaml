# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

dist: goreleaser-dist

homebrew_casks:
  - name: &cooldown cooldown
    ids:
      - *cooldown
    description: "A unified, language-agnostic dependency-cooldown CLI: refuse to adopt any version younger than a minimum release age, across tools, from one policy core."
    # Unsigned binaries keep macOS's quarantine attribute when Homebrew stages them, so clear it
    # after install.
    # The step lives in custom_block because goreleaser's install hook emits the deprecated
    # `postflight` stanza, and the Go-template escape keeps `{{staged_path}}` for Homebrew.
    custom_block: |
      os macos: "darwin", linux: "linux"

      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr",
                args:         ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/cooldown"],
                must_succeed: false
          end
        end
      end
    directory: Casks
    commit_author:
      name: romnn
      email: contact@romnn.com
    repository:
      owner: romnn
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: false

builds:
  - id: *cooldown
    builder: rust
    binary: *cooldown
    targets:
      # linux
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      # apple
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      # windows
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    dir: ./
    tool: cargo
    command: zigbuild
    flags:
      - "--release"
      - "--package=cooldown"

archives:
  - id: *cooldown
    formats: ["tar.gz"]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - *cooldown
    files:
      - LICENSE
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"

release:
  draft: false
